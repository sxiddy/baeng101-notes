<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect x="10" y="10" width="580" height="500" rx="16" class="df"/>
  <text x="300" y="60" font-size="28" text-anchor="middle" class="dt mono">GLOSSARY</text>
  <path d="M40 82h520" class="ds3" stroke-width="2"/>
  <text x="40" y="130" font-size="25" class="dt"><tspan font-weight="700">Ampere:</tspan><tspan class="dt2"> the unit of electric</tspan></text>
  <text x="40" y="164" font-size="25" class="dt2">current.</text>
  <text x="40" y="222" font-size="25" class="dt"><tspan font-weight="700">Bandwidth:</tspan><tspan class="dt2"> the range of</tspan></text>
  <text x="40" y="256" font-size="25" class="dt2">frequencies a channel carries.</text>
  <text x="40" y="314" font-size="25" class="dt"><tspan font-weight="700">Capacitor:</tspan><tspan class="dt2"> a component</tspan></text>
  <text x="40" y="348" font-size="25" class="dt2">that stores electric charge.</text>
  <text x="40" y="406" font-size="25" class="dt"><tspan font-weight="700">Diode:</tspan><tspan class="dt2"> a component that</tspan></text>
  <text x="40" y="440" font-size="25" class="dt2">lets current flow one way.</text>
  <text x="560" y="488" font-size="22" text-anchor="end" class="dt3">…</text>
  <text x="20" y="556" font-size="22" class="dtb mono">A → Z</text>
  <text x="112" y="556" font-size="22" class="dt3">term: short sentence definition</text>
</svg>
