    <rect x="315" y="470" width="120" height="40" rx="20" class="dfg" fill-opacity=".22"/><text x="375" y="498" font-size="22" text-anchor="middle" class="dtg">win</text>
    <rect x="455" y="470" width="120" height="40" rx="20" class="dfg" fill-opacity=".22"/><text x="515" y="498" font-size="22" text-anchor="middle" class="dtg">win</text>
