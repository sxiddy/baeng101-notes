    <rect x="455" y="270" width="120" height="40" rx="20" class="dfr" fill-opacity=".22"/><text x="515" y="298" font-size="22" text-anchor="middle" class="dtr">lose</text>

    <rect x="10" y="356" width="580" height="92" rx="14" class="df"/>
    <text x="30" y="396" font-size="26" class="dt">Compromise</text>
    <text x="30" y="434" font-size="22" class="dt3">both moderate</text>
    <rect x="315" y="370" width="260" height="40" rx="20" class="dfy" fill-opacity=".22"/><text x="445" y="398" font-size="22" text-anchor="middle" class="dty">win some, lose some</text>

